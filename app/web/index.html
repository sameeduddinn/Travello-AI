<!DOCTYPE html>
<html>
<head>

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flight_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=6">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=7"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=7"/>

  <title>flight_app</title>
  <link rel="manifest" href="manifest.json?v=6">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    #flutter-view {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div
    id="preloader"
    style="
      position: fixed;
      background: #FFF;
      width: 100%;
      height: 100%
    "
  >
    <img
      style="
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(36vw, 220px);
        height: auto;
        max-height: 180px;
        transform: translate(-50%, -50%);
        object-fit: contain;
      "
      src="icons/Icon-512.png?v=6"
      alt="loading"
    />
  </div>
  <script src="flutter_bootstrap.js" async></script>
