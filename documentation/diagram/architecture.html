<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travello AI - Architecture Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f7fc;
      --ink: #102238;
      --muted: #4d6a84;
      --edge: #bfd6e5;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #d8edf8, rgba(216, 237, 248, 0) 35%),
        radial-gradient(circle at 92% 84%, #d6f5f1, rgba(214, 245, 241, 0) 30%),
        var(--bg);
      padding: 20px;
    }

    .wrap {
      width: min(1300px, 100%);
      margin: 0 auto;
    }

    .head {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-family: "Montserrat", "Trebuchet MS", sans-serif;
      font-size: clamp(26px, 3vw, 42px);
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 18px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(21, 51, 73, 0.14);
    }

    .label {
      padding: 12px 16px;
      font-weight: 700;
      color: #214663;
      border-bottom: 1px solid var(--edge);
      background: #f6fbfe;
    }

    iframe {
      width: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    @media (min-width: 980px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <h1>Travello AI Architecture Overview</h1>
      <p class="sub">Flow Diagram and Overall System Model in a single documentation page.</p>
    </header>

    <section class="grid">
      <article class="card">
        <div class="label">Flow Diagram</div>
        <iframe src="routing_architecture.html" title="Travello AI Flow Diagram" height="760"></iframe>
      </article>
      <article class="card">
        <div class="label">Overall System Model</div>
        <iframe src="ui_architecture.html" title="Travello AI Overall System Model" height="760"></iframe>
      </article>
    </section>
  </div>
</body>
</html>
