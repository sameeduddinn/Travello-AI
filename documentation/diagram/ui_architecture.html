<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travello AI - Overall System Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0b2136;
      --bg-2: #113a53;
      --panel: #102c46;
      --panel-edge: #2f5b7a;
      --tile: #143650;
      --tile-edge: #37688a;
      --ink: #e9f7ff;
      --muted: #9bc6de;
      --accent: #ffb347;
      --accent-2: #30d5c8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 20%, rgba(48, 213, 200, 0.16), transparent 33%),
        radial-gradient(circle at 92% 8%, rgba(255, 179, 71, 0.20), transparent 30%),
        linear-gradient(150deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .board {
      width: min(1220px, 100%);
      border: 1px solid var(--panel-edge);
      border-radius: 26px;
      background: linear-gradient(170deg, rgba(20, 56, 84, 0.95), rgba(13, 43, 67, 0.96));
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .head {
      padding: 22px 26px 8px;
    }

    h1 {
      margin: 0;
      font-family: "Montserrat", "Trebuchet MS", sans-serif;
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.08;
      letter-spacing: 0.01em;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 17px;
      font-weight: 600;
    }

    .stage {
      padding: 8px 14px 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .tile {
      fill: var(--tile);
      stroke: var(--tile-edge);
      stroke-width: 2;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.22));
      animation: rise 0.7s ease both;
      transform-origin: center;
    }

    .tile-light {
      fill: #1e4c6f;
      stroke: #4f86ad;
    }

    .lane {
      fill: none;
      stroke: #6da6c7;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      pathLength: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.05s ease forwards;
    }

    .lane-strong {
      stroke: var(--accent-2);
      stroke-width: 2.8;
    }

    .lane-alt {
      stroke: var(--accent);
    }

    .tx-title {
      fill: var(--ink);
      text-anchor: middle;
      font-family: "Montserrat", "Trebuchet MS", sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .tx-sub {
      fill: #bddced;
      text-anchor: middle;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 600;
    }

    .layer-label {
      fill: #d8effb;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .d-1 { animation-delay: 0.1s; }
    .d-2 { animation-delay: 0.2s; }
    .d-3 { animation-delay: 0.3s; }
    .d-4 { animation-delay: 0.4s; }
    .d-5 { animation-delay: 0.5s; }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 760px) {
      .head { padding: 18px 18px 4px; }
      .stage { padding: 8px 8px 14px; }
    }
  </style>
</head>
<body>
  <main class="board">
    <div class="head">
      <h1>Travello AI Overall System Model</h1>
      <p class="sub">Flutter frontend, FastAPI backend, external travel/payment providers, and Supabase data layer.</p>
    </div>

    <div class="stage">
      <svg viewBox="0 0 1180 760" role="img" aria-label="Travello AI overall architecture diagram">
        <defs>
          <marker id="arr-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1,1 L11,6 L1,11 Z" fill="#30d5c8"></path>
          </marker>
          <marker id="arr-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1,1 L11,6 L1,11 Z" fill="#6da6c7"></path>
          </marker>
          <marker id="arr-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1,1 L11,6 L1,11 Z" fill="#ffb347"></path>
          </marker>
        </defs>

        <rect x="40" y="40" width="1100" height="680" rx="30" fill="none" stroke="#2e607f" stroke-width="2"></rect>

        <text class="layer-label" x="82" y="120">CLIENT</text>
        <text class="layer-label" x="280" y="120">APP LAYER</text>
        <text class="layer-label" x="535" y="120">API LAYER</text>
        <text class="layer-label" x="840" y="120">INTEGRATIONS</text>
        <text class="layer-label" x="500" y="560">DATA LAYER</text>

        <rect x="80" y="160" width="160" height="110" rx="18" class="tile d-1"></rect>
        <text class="tx-title" x="160" y="214">End Users</text>
        <text class="tx-sub" x="160" y="236">Mobile + Web</text>

        <rect x="288" y="160" width="220" height="110" rx="18" class="tile tile-light d-2"></rect>
        <text class="tx-title" x="398" y="206">Flutter App</text>
        <text class="tx-sub" x="398" y="228">Auth | Search | Booking UI</text>
        <text class="tx-sub" x="398" y="246">QR View | Wishlist | Weather</text>

        <rect x="540" y="140" width="270" height="150" rx="18" class="tile d-3"></rect>
        <text class="tx-title" x="675" y="186">FastAPI Backend</text>
        <text class="tx-sub" x="675" y="208">Routers: auth, bookings, payments</text>
        <text class="tx-sub" x="675" y="226">flights, hotels, trains, weather</text>
        <text class="tx-sub" x="675" y="244">wishlist, notifications, email</text>

        <rect x="844" y="126" width="250" height="86" rx="16" class="tile d-4"></rect>
        <text class="tx-title" x="969" y="164">Travel APIs</text>
        <text class="tx-sub" x="969" y="186">Amadeus | AviationStack</text>

        <rect x="844" y="230" width="250" height="86" rx="16" class="tile d-4"></rect>
        <text class="tx-title" x="969" y="268">Payment Gateway</text>
        <text class="tx-sub" x="969" y="290">Card/UPI/Wallet Processing</text>

        <rect x="844" y="334" width="250" height="86" rx="16" class="tile d-4"></rect>
        <text class="tx-title" x="969" y="372">Notification Alerts</text>
        <text class="tx-sub" x="969" y="394">Alert Service</text>

        <rect x="330" y="590" width="520" height="92" rx="16" class="tile tile-light d-5"></rect>
        <text class="tx-title" x="590" y="626">Supabase / PostgreSQL</text>
        <text class="tx-sub" x="590" y="648">profiles | bookings | payments | passengers | wishlist | notifications</text>

        <path class="lane lane-strong" marker-end="url(#arr-cyan)" d="M240 214 L288 214" style="animation-delay:0.12s"></path>
        <path class="lane lane-strong" marker-end="url(#arr-cyan)" d="M508 214 L540 214" style="animation-delay:0.20s"></path>

        <path class="lane" marker-end="url(#arr-blue)" d="M810 168 L844 168" style="animation-delay:0.28s"></path>
        <path class="lane" marker-end="url(#arr-blue)" d="M810 272 L844 272" style="animation-delay:0.36s"></path>
        <path class="lane" marker-end="url(#arr-blue)" d="M810 376 L844 376" style="animation-delay:0.44s"></path>

        <path class="lane lane-alt" marker-end="url(#arr-gold)" d="M675 290 L675 590" style="animation-delay:0.54s"></path>
        <path class="lane" marker-end="url(#arr-blue)" d="M540 252 L398 252 L398 270" style="animation-delay:0.64s"></path>
      </svg>
    </div>
  </main>
</body>
</html>
